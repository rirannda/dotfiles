# Keep the original Arch Linux wallpaper and colors independent of Matugen.
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/hypr/img/simple.png
    blur_passes = 0
    noise = 0
    contrast = 1
    brightness = 1
    vibrancy = 0
}

# Built-in 24-hour clock; no external polling command is needed.
label {
    monitor =
    text = $TIME
    color = rgba(ffffffed)
    font_size = 90
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    outer_color = rgb(1793d1)
    inner_color = rgba(ffffff26)
    font_color = rgb(ffffff)
    check_color = rgb(1793d1)
    fail_color = rgb(e06c75)
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    fade_on_empty = false
    rounding = 12
    position = 0, -100
    halign = center
    valign = center
}
