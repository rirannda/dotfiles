[config]
version_check = false

# All paths are relative to this config file. Keep ags, matugen, hypr and wofi as sibling folders. GTK applications use their standard dark theme.
[templates.ags]
input_path = "templates/colors.css"
output_path = "../ags/colors.css"

[templates.hyprland]
input_path = "templates/hyprland.lua"
output_path = "../hypr/colors/colors.lua"

[templates.hyprlock]
input_path = "templates/hyprland.conf"
output_path = "../hypr/colors/colors.conf"

# Wofi-only GTK3 colors; does not override the desktop GTK theme.
[templates.wofi]
input_path = "templates/wofi.css"
output_path = "../wofi/colors.css"
