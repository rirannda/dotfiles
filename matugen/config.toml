[config]
version_check = false

# All paths are relative to this config file. Keep ags, matugen and hypr as sibling folders. GTK uses its standard dark theme.
[templates.ags]
input_path = "templates/colors.css"
output_path = "../ags/colors.css"

[templates.hyprland]
input_path = "templates/hyprland.lua"
output_path = "../hypr/colors/colors.lua"

[templates.hyprlock]
input_path = "templates/hyprland.conf"
output_path = "../hypr/colors/colors.conf"
